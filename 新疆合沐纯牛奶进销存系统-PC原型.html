<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合沐纯牛奶进销存 · PC 端线框交互原型</title>
<style>
  :root{--ink:#1f2937;--muted:#9ca3af;--line:#d6dae0;--soft:#f3f5f8;--blue:#2563eb;--blue-bg:#eff4ff;--green:#16a34a;--green-bg:#eefbf1;--amber:#d97706;--amber-bg:#fff7e8;--red:#dc2626;--red-bg:#fdeeee;--side:#1f2430}
  *{box-sizing:border-box}
  body{margin:0;background:#eceff3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
  .logo{font-weight:800;font-size:16px;color:var(--blue)}
  .logo small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
  .top-right{display:flex;align-items:center;gap:14px}
  .role-switch{display:flex;gap:6px}
  .role{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;color:#475569;background:#fff}
  .role.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .user{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569}
  .layout{display:flex;height:calc(100vh - 56px)}
  .sidebar{width:216px;background:var(--side);color:#cbd5e1;padding:16px 0;overflow-y:auto;flex:0 0 auto}
  .side-group{padding:6px 18px;font-size:11px;color:#64748b;margin-top:10px}
  .side-item{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;font-size:14px;color:#cbd5e1;border-left:3px solid transparent}
  .side-item:hover{background:#263142}
  .side-item.active{background:#263142;color:#fff;border-left-color:var(--blue)}
  .main{flex:1;overflow-y:auto;padding:22px}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
  .page-title{font-size:18px;font-weight:700;margin:0 0 16px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff}
  .btn.danger{border-color:var(--red);color:var(--red)}
  .btn.ghost{background:var(--soft);border-color:var(--line);color:#475569}
  .btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h4{margin:0 0 12px;font-size:14px;color:#111827}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;white-space:nowrap}
  th{background:var(--soft);color:#475569;font-weight:600}
  tr:hover td{background:#fafbfc}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600}
  .badge.ok{background:var(--green-bg);color:var(--green)}
  .badge.warn{background:var(--amber-bg);color:var(--amber)}
  .badge.red{background:var(--red-bg);color:var(--red)}
  .badge.info{background:var(--blue-bg);color:var(--blue)}
  .badge.gray{background:var(--soft);color:#64748b}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .lb{font-size:12px;color:var(--muted)}
  .kpi .vl{font-size:24px;font-weight:800;margin:4px 0}
  .kpi .tr{font-size:12px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:200px}
  .chart-box .ph{height:150px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 10px,#fff 10px,#fff 20px)}
  .tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:2px solid var(--line);padding-bottom:0}
  .ptab{padding:9px 16px;cursor:pointer;font-size:13px;color:#64748b;border-bottom:2.5px solid transparent;margin-bottom:-2px}
  .ptab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px}
  .toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
  .split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  @media(max-width:860px){.split,.charts,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">合沐纯牛奶·进销存 <small>江西赣州</small></div>
  <div class="top-right">
    <div class="role-switch" id="roleSwitch">
      <div class="role active" data-role="gm">总经理</div>
      <div class="role" data-role="bm">业务经理</div>
      <div class="role" data-role="fin">财务</div>
    </div>
    <div class="user">👤 <span id="roleName">总经理</span></div>
  </div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let role='gm', page='dashboard', ptab='product';

// 菜单定义（按角色可见）
const MENUS = {
  gm:[
    {g:'经营',items:[['dashboard','📊','经营看板'],['approval','✅','审批中心']]},
    {g:'业务',items:[['sales','🛒','销售订单'],['purchase','📦','采购管理'],['inventory','🏬','库存管理'],['receivable','💰','应收与回款'],['promotion','🎁','促销管理']]},
    {g:'基础',items:[['master','🗂️','基础档案'],['visit','📍','巡店管理']]}
  ],
  bm:[
    {g:'经营',items:[['dashboard','📊','区域看板'],['sales','🛒','销售订单'],['purchase','📦','采购管理']]},
    {g:'运营',items:[['inventory','🏬','库存管理'],['receivable','💰','应收与回款'],['promotion','🎁','促销管理'],['visit','📍','巡店管理']]},
    {g:'基础',items:[['master','🗂️','基础档案']]}
  ],
  fin:[
    {g:'资金',items:[['receivable','💰','应收与回款'],['dashboard','📊','资金看板']]},
    {g:'基础',items:[['master','🗂️','客户与对账']]}
  ]
};
const PAGE_TITLE={dashboard:'经营看板',sales:'销售订单',purchase:'采购管理',inventory:'库存管理',receivable:'应收与回款',promotion:'促销管理',master:'基础档案',visit:'巡店管理',approval:'审批中心'};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

// 数据
let orders=[
  {no:'SO20261011001',store:'旺家超市',amt:896,status:'待审核'},
  {no:'SO20261011002',store:'好客多便利店',amt:540,status:'待审核'},
  {no:'SO20261010018',store:'母婴坊',amt:1260,status:'配送中'},
  {no:'SO20261010012',store:'兴盛商贸',amt:2100,status:'已签收'}
];
const statusBadge={待审核:'info',配送中:'info',已签收:'ok',待拣货:'warn',已驳回:'red'};
let lots=[
  {wh:'主仓库',p:'袋装 200ml',lot:'L20260706',exp:'2026-10-20',qty:420,st:'正常'},
  {wh:'地区仓',p:'袋装 200ml',lot:'L20260628',exp:'2026-10-12',qty:360,st:'临期'},
  {wh:'地区仓',p:'盒装 200ml',lot:'L20260810',exp:'2027-02-08',qty:180,st:'正常'},
  {wh:'主仓库',p:'盒装 200ml',lot:'L20260520',exp:'2026-10-01',qty:60,st:'过期'}
];
const lotBadge={正常:'ok',临期:'warn',过期:'red'};
let receivables=[
  {store:'好客多便利店',amt:2400,due:'2026-09-29',st:'逾期 12 天'},
  {store:'母婴坊',amt:1050,due:'2026-10-16',st:'正常'},
  {store:'兴盛商贸',amt:2100,due:'2026-10-11',st:'今日到期'},
  {store:'旺家超市',amt:896,due:'2026-11-10',st:'正常'}
];
const recBadge={'正常':'ok','今日到期':'warn','逾期 12 天':'red'};
const promotions=[
  {name:'袋装买赠',store:'旺家超市',fee:800,sales:12000,roi:'15.0',st:'执行中'},
  {name:'盒装陈列',store:'好客多',fee:500,sales:6800,roi:'13.6',st:'已结束'},
  {name:'满减促销',store:'母婴坊',fee:1200,sales:9600,roi:'8.0',st:'待核算'}
];
const promBadge={执行中:'ok',已结束:'gray',待核算:'warn'};
const approvals=[
  {biz:'采购申请',no:'PO20261011001',req:'业务经理·王',amt:50000,type:'采购'},
  {biz:'促销费用',no:'PF20261010008',req:'业务经理·王',amt:800,type:'促销'},
  {biz:'折扣折让',no:'SO20261011002',req:'业务员·李',amt:120,type:'销售'}
];

function renderSidebar(){
  $('#sidebar').innerHTML = MENUS[role].map(g=>`<div class="side-group">${g.g}</div>`+g.items.map(it=>`<div class="side-item ${it[0]===page?'active':''}" data-page="${it[0]}">${it[1]}<span>${it[2]}</span></div>`).join('')).join('');
}
function renderBreadcrumb(){ return `<div class="crumb">首页 / ${PAGE_TITLE[page]||''}</div>`; }

function kpiCard(lb,vl,tr,cls=''){ return `<div class="kpi"><div class="lb">${lb}</div><div class="vl" style="${cls}">${vl}</div><div class="tr">${tr}</div></div>`; }

// 页面渲染
function pDashboard(){
  const isGm = role==='gm';
  return `<div class="page-title">${isGm?'全局经营看板':'区域经营看板（赣州）'}</div>
  <div class="kpis">
    ${kpiCard('本月销售额','¥512,360','较上月 +12.4%')}
    ${kpiCard('本月毛利','¥118,400','毛利率 23.1%')}
    ${kpiCard('应收账款','¥86,200','逾期 ¥12,400','color:var(--amber)')}
    ${kpiCard('临期/过期库存','3 批次','金额约 ¥8,600','color:var(--red)')}
  </div>
  <div class="charts">
    <div class="chart-box"><h4>销售趋势（袋装 vs 盒装）</h4><div class="ph">📈 折线图占位 · 袋装 / 盒装 双系列</div></div>
    <div class="chart-box"><h4>库存效期分布</h4><div class="ph">🥧 环形图占位 · 正常 / 临期 / 过期</div></div>
    <div class="chart-box"><h4>区域门店销售 TOP</h4><div class="ph">📊 柱状图占位 · 各门店排名</div></div>
    <div class="chart-box"><h4>促销投入产出榜</h4><div class="ph">📉 条形图占位 · ROI 对比</div></div>
  </div>`;
}
function pSales(){
  return `<div class="page-title">销售订单</div>
  <div class="toolbar"><div><button class="btn ghost sm">草稿</button> <button class="btn ghost sm">待审核</button> <button class="btn ghost sm">配送中</button> <button class="btn ghost sm">已签收</button></div>
  <button class="btn primary" onclick="toast('进入新建要货单（代录）流程')">+ 新建销售单</button></div>
  <div class="card"><table><tr><th>单号</th><th>门店</th><th>金额</th><th>状态</th><th>操作</th></tr>
  ${orders.map((o,i)=>`<tr><td>${o.no}</td><td>${o.store}</td><td>¥${o.amt}</td><td><span class="badge ${statusBadge[o.status]}">${o.status}</span></td>
  <td>${o.status==='待审核'?`<button class="btn green sm" onclick="doOrder(${i},1)">通过</button> <button class="btn danger sm" onclick="doOrder(${i},0)">驳回</button>`:`<button class="btn ghost sm" onclick="toast('查看订单明细 '+o.no)">详情</button>`}</td></tr>`).join('')}
  </table></div>`;
}
function doOrder(i,ok){ orders[i].status = ok?'待拣货':'已驳回'; toast(ok?'审核通过，进入拣货':'已驳回'); render(); }

function pPurchase(){
  return `<div class="page-title">采购管理</div>
  <div class="toolbar"><div class="tabs"><div class="ptab active">采购单</div><div class="ptab">入库验收</div><div class="ptab">供应商应付</div></div>
  <button class="btn primary" onclick="toast('创建采购申请：选择供应商、商品、入库仓')">+ 采购申请</button></div>
  <div class="card"><h4>采购单列表</h4><table><tr><th>单号</th><th>供应商</th><th>商品</th><th>金额</th><th>状态</th><th>操作</th></tr>
  <tr><td>PO20261011001</td><td>合沐乳业</td><td>袋装 200ml × 18000</td><td>¥50,400</td><td><span class="badge info">待审批</span></td><td><button class="btn green sm" onclick="toast('采购审批通过')">审批</button></td></tr>
  <tr><td>PO20261005002</td><td>合沐乳业</td><td>盒装 200ml × 9000</td><td>¥32,400</td><td><span class="badge warn">待收货</span></td><td><button class="btn primary sm" onclick="toast('进入入库验收，登记生产日期与批次')">入库验收</button></td></tr>
  <tr><td>PO20261001007</td><td>合沐乳业</td><td>袋装 200ml × 12000</td><td>¥33,600</td><td><span class="badge ok">已收货</span></td><td><button class="btn ghost sm">详情</button></td></tr>
  </table></div>
  <div class="card"><h4>供应商应付概览</h4><div class="kpis">${kpiCard('应付余额','¥50,400','合沐乳业 · 账期 30 天')}${kpiCard('本月已付','¥0','待登记付款')}</div></div>`;
}
function pInventory(){
  return `<div class="page-title">库存管理</div>
  <div class="toolbar"><div class="tabs"><div class="ptab active">批次库存</div><div class="ptab">调拨</div><div class="ptab">盘点</div><div class="ptab">报损</div></div>
  <div><button class="btn ghost sm" onclick="toast('新建调拨单：主仓库 → 地区仓')">调拨</button> <button class="btn ghost sm" onclick="toast('新建盘点单')">盘点</button> <button class="btn danger sm" onclick="toast('新建报损单')">报损</button></div></div>
  <div class="card"><h4>效期预警批次（FIFO 优先出库）</h4>
  <table><tr><th>仓库</th><th>商品</th><th>批次号</th><th>生产日期</th><th>到期日</th><th>现存量</th><th>状态</th><th>操作</th></tr>
  ${lots.map(l=>`<tr><td>${l.wh}</td><td>${l.p}</td><td>${l.lot}</td><td>${l.exp}</td><td>${l.exp}</td><td>${l.qty}</td><td><span class="badge ${lotBadge[l.st]}">${l.st}</span></td>
  <td>${l.st==='过期'?`<button class="btn danger sm" onclick="toast('过期待报损：L'+'${l.lot} 冻结不可售')">报损</button>`:`<button class="btn ghost sm" onclick="toast('查看批次流水')">流水</button>`}</td></tr>`).join('')}
  </table></div>
  <div class="card"><h4>库存分布</h4><div class="kpis">${kpiCard('主仓库总量','126,400','袋/盒合计')}${kpiCard('地区仓总量','48,200','袋/盒合计')}${kpiCard('在途调拨','3,600','待入库')}</div></div>`;
}
function pReceivable(){
  return `<div class="page-title">应收与回款</div>
  <div class="toolbar"><div class="tabs"><div class="ptab active">应收明细</div><div class="ptab">回款登记</div><div class="ptab">对账单</div></div>
  <button class="btn primary" onclick="toast('登记回款，按 FIFO 核销应收')">+ 登记回款</button></div>
  <div class="split">
    <div class="card"><h4>应收账龄</h4><table><tr><th>门店</th><th>应收</th><th>到期日</th><th>状态</th><th>操作</th></tr>
    ${receivables.map(r=>`<tr><td>${r.store}</td><td>¥${r.amt}</td><td>${r.due}</td><td><span class="badge ${recBadge[r.st]}">${r.st}</span></td>
    <td><button class="btn ghost sm" onclick="toast('向 ${r.store} 发起催收 / 登记回款')">核销</button></td></tr>`).join('')}
    </table></div>
    <div class="card"><h4>账龄结构</h4><div class="ph" style="height:180px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 10px,#fff 10px,#fff 20px)">📊 账龄柱状图占位</div></div>
  </div>
  <div class="card"><h4>对账单</h4><table><tr><th>门店</th><th>期初</th><th>本期销售</th><th>本期回款</th><th>期末余额</th><th>操作</th></tr>
  <tr><td>旺家超市</td><td>¥0</td><td>¥8,960</td><td>¥8,064</td><td>¥896</td><td><button class="btn ghost sm" onclick="toast('生成并导出对账单 PDF')">导出对账</button></td></tr>
  </table></div>`;
}
function pPromotion(){
  return `<div class="page-title">促销管理</div>
  <div class="toolbar"><div class="tabs"><div class="ptab active">活动列表</div><div class="ptab">费用审批</div><div class="ptab">投入产出</div></div>
  <button class="btn primary" onclick="toast('创建促销活动（特价/买赠/满减/陈列）')">+ 新建活动</button></div>
  <div class="card"><h4>活动与投入产出</h4><table><tr><th>活动</th><th>门店</th><th>费用</th><th>带动销售</th><th>投入产出比</th><th>状态</th><th>操作</th></tr>
  ${promotions.map(p=>`<tr><td>${p.name}</td><td>${p.store}</td><td>¥${p.fee}</td><td>¥${p.sales}</td><td>1:${p.roi}</td><td><span class="badge ${promBadge[p.st]}">${p.st}</span></td>
  <td>${p.st==='待核算'?`<button class="btn green sm" onclick="toast('完成投入产出核算')">核算</button>`:`<button class="btn ghost sm" onclick="toast('查看活动详情与促销员作业')">详情</button>`}</td></tr>`).join('')}
  </table></div>
  <div class="card"><h4>促销员作业记录</h4><table><tr><th>促销员</th><th>门店</th><th>签到</th><th>签退</th><th>销量上报</th></tr>
  <tr><td>王 · 促销员</td><td>旺家超市</td><td>10:02</td><td>—</td><td>袋装 68</td></tr></table></div>`;
}
function pMaster(){
  return `<div class="page-title">基础档案</div>
  <div class="tabs"><div class="ptab ${ptab==='product'?'active':''}" data-ptab="product">商品</div><div class="ptab ${ptab==='store'?'active':''}" data-ptab="store">客户门店</div><div class="ptab ${ptab==='supplier'?'active':''}" data-ptab="supplier">供应商</div><div class="ptab ${ptab==='price'?'active':''}" data-ptab="price">价格</div></div>
  ${ptab==='product'?productTab():ptab==='store'?storeTab():ptab==='supplier'?supplierTab():priceTab()}`;
}
function productTab(){ return `<div class="card"><h4>商品档案（SKU）</h4><table><tr><th>编码</th><th>名称</th><th>品类</th><th>规格</th><th>箱规</th><th>保质期(天)</th><th>临期预警(天)</th><th>最低售价</th><th>状态</th></tr>
<tr><td>HM-BZ-200</td><td>新疆合沐纯牛奶</td><td>袋装</td><td>200ml</td><td>16</td><td>45</td><td>7</td><td>¥2.6</td><td><span class="badge ok">启用</span></td></tr>
<tr><td>HM-HZ-200</td><td>新疆合沐纯牛奶</td><td>盒装</td><td>200ml</td><td>12</td><td>180</td><td>15</td><td>¥3.3</td><td><span class="badge ok">启用</span></td></tr>
</table><div class="toolbar" style="margin-top:12px"><button class="btn primary sm" onclick="toast('新增商品（品类：袋装/盒装，规格 200ml）')">+ 新增商品</button></div></div>`; }
function storeTab(){ return `<div class="card"><h4>客户门店</h4><table><tr><th>门店</th><th>县区</th><th>类型</th><th>账期(天)</th><th>信用额度</th><th>归属业务员</th><th>状态</th></tr>
<tr><td>旺家超市</td><td>章贡区</td><td>超市</td><td>30</td><td>¥20,000</td><td>李</td><td><span class="badge ok">正常</span></td></tr>
<tr><td>好客多便利店</td><td>南康区</td><td>便利店</td><td>15</td><td>¥5,000</td><td>李</td><td><span class="badge ok">正常</span></td></tr>
<tr><td>母婴坊</td><td>赣县区</td><td>母婴</td><td>30</td><td>¥8,000</td><td>张</td><td><span class="badge ok">正常</span></td></tr>
</table></div>`; }
function supplierTab(){ return `<div class="card"><h4>供应商</h4><table><tr><th>名称</th><th>联系人</th><th>结算方式</th><th>账期(天)</th></tr><tr><td>合沐乳业</td><td>刘经理</td><td>月结</td><td>30</td></tr></table></div>`; }
function priceTab(){ return `<div class="card"><h4>价格体系</h4><table><tr><th>商品</th><th>基础售价</th><th>最低售价</th><th>生效日</th></tr><tr><td>袋装 200ml</td><td>¥2.8</td><td>¥2.6</td><td>2026-10-01</td></tr><tr><td>盒装 200ml</td><td>¥3.6</td><td>¥3.3</td><td>2026-10-01</td></tr></table><div class="hint" style="font-size:12px;color:var(--muted);margin-top:10px">价格调整需业务经理提交、总经理审批后生效</div></div>`; }
function pVisit(){ return `<div class="page-title">巡店管理</div>
<div class="card"><h4>拜访计划与记录</h4><table><tr><th>业务员</th><th>门店</th><th>计划日</th><th>签到</th><th>陈列/效期检查</th></tr>
<tr><td>李</td><td>旺家超市</td><td>10-11</td><td>09:32 ✓</td><td><span class="badge red">发现临期 18 件</span></td></tr>
<tr><td>张</td><td>母婴坊</td><td>10-11</td><td>未签到</td><td>—</td></tr></table></div>`; }
function pApproval(){
  return `<div class="page-title">审批中心</div>
  <div class="card"><h4>待我审批</h4><table><tr><th>类型</th><th>单号</th><th>申请人</th><th>金额</th><th>操作</th></tr>
  ${approvals.map((a,i)=>`<tr><td>${a.biz}</td><td>${a.no}</td><td>${a.req}</td><td>¥${a.amt}</td>
  <td><button class="btn green sm" onclick="doApproval(${i},1)">通过</button> <button class="btn danger sm" onclick="doApproval(${i},0)">驳回</button></td></tr>`).join('')}
  </table>${approvals.length===0?'<div style="text-align:center;color:var(--muted);padding:20px">✅ 待办已清空</div>':''}</div>`;
}
function doApproval(i,ok){ const a=approvals[i]; approvals.splice(i,1); toast((ok?'已通过':'已驳回')+'：'+a.no); render(); }

const RENDER={dashboard:pDashboard,sales:pSales,purchase:pPurchase,inventory:pInventory,receivable:pReceivable,promotion:pPromotion,master:pMaster,visit:pVisit,approval:pApproval};
function render(){ renderSidebar(); $('#main').innerHTML = renderBreadcrumb() + (RENDER[page]?RENDER[page]():''); $('#roleName').textContent=role==='gm'?'总经理':role==='bm'?'业务经理':'财务'; }

$('#sidebar').addEventListener('click',e=>{ const it=e.target.closest('.side-item'); if(it){ page=it.dataset.page; render(); }});
$('#roleSwitch').addEventListener('click',e=>{ const r=e.target.closest('.role'); if(!r) return; role=r.dataset.role; document.querySelectorAll('#roleSwitch .role').forEach(x=>x.classList.toggle('active',x===r)); const keys=MENUS[role].flatMap(g=>g.items.map(i=>i[0])); if(!keys.includes(page)) page=keys[0]; ptab='product'; render(); });
$('#main').addEventListener('click',e=>{ const t=e.target.closest('.ptab'); if(t&&t.dataset.ptab){ ptab=t.dataset.ptab; render(); }});

render();
</script>
</body>
</html>
