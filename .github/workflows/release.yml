name: 'Release: Build & Package App'

on:
  release:
    types: [published]
  # Allows (re)building a release on demand, e.g. when the `release` event did
  # not fire or a single platform needs to be retried.
  workflow_dispatch:
    inputs:
      release-id:
        description: 'Release ID to upload the bundles to (draft releases are supported)'
        required: false
        type: string
      tag:
        description: 'Tag to build from and upload to (e.g. v1.6.7)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            args: '--bundles nsis'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          # Android (arm64-v8a). build.rs downloads and bundles the ONNX Runtime
          # library for this ABI, and the APK is signed with the ANDROID_KEY_*
          # secrets when configured, otherwise with a generated debug keystore.
          - platform: 'ubuntu-latest'
            target: ''
            args: ''
            mobile: 'android'
            asset-prefix: '04'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id || inputs.release-id }}
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      tag-name: ${{ github.event.release.tag_name || inputs.tag }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      mobile: ${{ matrix.mobile }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write
