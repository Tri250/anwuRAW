name: 'Release: Build & Package App'

on:
  # GitHub Release 页面创建新版本后自动触发（主路径）
  release:
    types: [created]

  # 支持手动触发：在 GitHub Actions 页面点击 Run workflow 按钮
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 Git tag（留空则使用仓库最新 tag 或当前分支 HEAD）'
        required: false
        type: string

  # 推送 tag (v*) 时自动触发
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # 触发适配：workflow_dispatch / push tags 路径下先创建一个 GitHub Release，
  # 让下游 matrix job 拿到 release-id；release.created 路径直接透传。
  # ---------------------------------------------------------------------------
  ensure-release:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # 用于读取 tauri.conf.json 版本号做 tag 兜底，并让 git ls-remote 沿用 runner 认证

      - name: Determine tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ -n "${{ github.ref_name }}" && "${{ github.ref_name }}" == v* ]]; then
            tag="${{ github.ref_name }}"
          else
            # 取仓库最新 tag（checkout 后 origin 已带 runner 认证）
            tag="$(git ls-remote --tags --sort=-v:refname origin \
                   | head -1 | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' \
                   | grep -v '\^{}' || true)"
            # ls-remote 不可用时退回 gh release list（需 GH_TOKEN）
            if [[ -z "$tag" ]]; then
              tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
            fi
          fi
          # 兜底：仓库无任何 tag/release 时，使用 tauri.conf.json 当前版本号（即当前分支 HEAD）
          if [[ -z "$tag" ]]; then
            tag="v$(node -e "const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8'));process.stdout.write(c.version||'0.0.0')")"
          fi
          echo "Resolved tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (if not exists)
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if [[ -z "$tag" ]]; then
            echo "❌ No tag resolved. Aborting."
            exit 1
          fi
          # 检查是否已存在
          if gh release view "$tag" 2>/dev/null; then
            echo "✅ Release for tag $tag already exists."
            id="$(gh release view "$tag" --json id -q '.id')"
          else
            echo "📝 Creating draft release for $tag ..."
            # --target 指向当前 HEAD，确保新 tag 落在触发本次构建的提交上
            gh release create "$tag" \
              --title "$tag" \
              --notes "Automated release for $tag" \
              --target "$GITHUB_SHA" \
              --draft
            id="$(gh release view "$tag" --json id -q '.id')"
          fi
          echo "release-id=$id" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT

  release:
    needs: ensure-release
    # release 事件时 ensure-release 被跳过（!cancelled() 允许评估）；
    # dispatch/tag 路径下 ensure-release 必须成功，失败即中止，避免空 release-id 进入构建
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.ensure-release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows x64 (NSIS installer) ---
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01_win-x64'

          # --- macOS Apple Silicon (M1/M2/M3/M4, ARM64) ---
          - platform: 'macos-latest'
            target: aarch64-apple-darwin
            asset-prefix: '02_macos-arm64'

          # --- macOS Apple Silicon + Tethering feature ---
          - platform: 'macos-latest'
            target: aarch64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_macos-arm64_tethering'

          # --- macOS Intel (x86_64, last stable Intel runner) ---
          - platform: 'macos-13'
            target: x86_64-apple-darwin
            asset-prefix: '02_macos-intel'

          # --- macOS Intel + Tethering feature ---
          - platform: 'macos-13'
            target: x86_64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_macos-intel_tethering'

          # --- Linux x86_64 (Ubuntu 22.04 LTS) ---
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03_linux-x64_22.04'

          # --- Linux x86_64 (Ubuntu 24.04 LTS) ---
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03_linux-x64_24.04'

          # --- Linux + Tethering (Ubuntu 22.04) ---
          - platform: 'ubuntu-22.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_linux-x64_22.04_tethering'

          # --- Linux + Tethering (Ubuntu 24.04) ---
          - platform: 'ubuntu-24.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_linux-x64_24.04_tethering'

          # --- Android ARM64-v8a (Ubuntu runner 交叉编译) ---
          - platform: 'ubuntu-latest'
            mobile: 'android'
            target: 'aarch64-linux-android'
            args: '--target aarch64'
            asset-prefix: '04_android-arm64'

    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id || needs.ensure-release.outputs.release-id }}
      ref: ${{ needs.ensure-release.outputs.tag || github.ref }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch].[ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
      mobile: ${{ matrix.mobile }}
    secrets: inherit
    permissions:
      contents: write
