name: 'Release: Build & Package App'

on:
  release:
    types: [published]
  # Allows (re)building a release on demand, e.g. when the `release` event did
  # not fire or a single platform needs to be retried.
  workflow_dispatch:
    inputs:
      release-id:
        description: 'Release ID to upload the bundles to (draft releases are supported)'
        required: false
        type: string
      tag:
        description: 'Tag to build from and upload to (e.g. v1.6.7)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Publishing a draft that was already built (e.g. toggling draft off/on, or
  # publishing after a manual dispatch) must not rebuild every platform. Manual
  # dispatches always build, so a partially failed matrix can be retried.
  precheck:
    name: Precheck release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      has-assets: ${{ steps.count.outputs.count != '0' }}
    permissions:
      contents: read
    steps:
      - name: Count existing release assets
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="${{ github.event.release.id }}"
          count=$(gh api "repos/${{ github.repository }}/releases/${release_id}/assets" --jq 'length' 2>/dev/null || echo 0)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Release ${release_id} already has ${count} asset(s)."

  release:
    needs: precheck
    if: github.event_name == 'workflow_dispatch' || needs.precheck.outputs.has-assets != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            args: '--bundles nsis'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          # Android is intentionally not part of the release matrix: it needs
          # ANDROID_KEY_* signing secrets plus the ONNX Runtime Android libs in
          # src-tauri/libs, neither of which is committed. build.yml still
          # supports `mobile: android` for manually configured environments.
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id || inputs.release-id }}
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      tag-name: ${{ github.event.release.tag_name || inputs.tag }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write
