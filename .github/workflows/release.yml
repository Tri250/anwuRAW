name: 'Release: Build & Package App'

on:
  release:
    types: [published]
  # Allows (re)building a release on demand, e.g. when the `release` event did
  # not fire or a single platform needs to be retried.
  workflow_dispatch:
    inputs:
      release-id:
        description: 'Release ID to upload the bundles to (draft releases are supported)'
        required: false
        type: string
      tag:
        description: 'Tag to build from and upload to (e.g. v1.6.7)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Publishing a draft that was already built (e.g. toggling draft off/on, or
  # publishing after a manual dispatch) must not rebuild every platform. Manual
  # dispatches always build, so a partially failed matrix can be retried.
  precheck:
    name: Precheck release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.count.outputs.complete }}
    permissions:
      contents: read
    steps:
      - name: Count existing release assets
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A release is only skipped when every bundle of the 13-job matrix is
          # present (30 assets). Tracking a bare "has assets" flag used to skip
          # the rebuild for partially uploaded releases, which shipped incomplete
          # downloads; tauri-action replaces same-named assets, so re-running the
          # matrix on an incomplete release is safe.
          expected=30
          # Retry a few times: a single failed query must not silently report
          # "0 assets" (which would needlessly trigger a full matrix rebuild).
          count=0
          for attempt in 1 2 3; do
            if ids=$(gh api --paginate "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[].id' 2>/tmp/assets_err); then
              count=$(printf '%s\n' "$ids" | grep -c . || true)
              count=${count:-0}
            else
              echo "Attempt ${attempt}: assets API query failed:" >&2
              cat /tmp/assets_err >&2 || true
              count=0
            fi
            echo "Attempt ${attempt}: ${count}/${expected} asset(s)."
            [ "${count}" -ge "${expected}" ] && break
            sleep 15
          done
          if [ "${count}" -ge "${expected}" ]; then complete=true; else complete=false; fi
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          echo "Release ${RELEASE_ID} has ${count}/${expected} asset(s) (complete=${complete})."

  release:
    needs: precheck
    # `!cancelled()` drops the implicit success() check so that the
    # workflow_dispatch path still runs when `precheck` is skipped (it only
    # executes for `release` events).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.precheck.result == 'success' && needs.precheck.outputs.complete != 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            args: '--bundles nsis'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          # Android (arm64-v8a). build.rs downloads and bundles the ONNX Runtime
          # library for this ABI, and the APK is signed with the ANDROID_KEY_*
          # secrets when configured, otherwise with a generated debug keystore.
          - platform: 'ubuntu-latest'
            target: ''
            args: ''
            mobile: 'android'
            asset-prefix: '04'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id || inputs.release-id }}
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      tag-name: ${{ github.event.release.tag_name || inputs.tag }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      mobile: ${{ matrix.mobile }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write

  # Closed-loop guard: a matrix run is only useful when every platform bundle
  # reached the release page. Fails loudly instead of leaving users with a
  # release that silently misses some installers.
  verify:
    name: Verify release assets
    needs: [precheck, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && (github.event.release.id || inputs.release-id) != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert all bundles were uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id || inputs.release-id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          expected=30
          # Retry a few times: a transient API failure right after the matrix
          # finished must not report "0 assets" and fail the release.
          count=0
          for attempt in 1 2 3 4 5; do
            if ids=$(gh api --paginate "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[].id' 2>/tmp/assets_err); then
              count=$(printf '%s\n' "$ids" | grep -c . || true)
              count=${count:-0}
            else
              echo "Attempt ${attempt}: assets API query failed:" >&2
              cat /tmp/assets_err >&2 || true
              count=0
            fi
            echo "Attempt ${attempt}: ${count}/${expected} asset(s)."
            [ "${count}" -ge "${expected}" ] && break
            sleep 20
          done
          if [ "${count}" -lt "${expected}" ]; then
            echo "::error::Expected ${expected} release assets, found ${count}."
            exit 1
          fi
