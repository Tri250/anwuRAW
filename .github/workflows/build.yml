name: build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
      asset-name-pattern:
        required: false
        type: string
      upload-artifacts:
        required: false
        type: boolean
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      mobile:
        required: false
        type: string
        default: ''

  # 支持手动单独触发单平台构建（例如 release matrix 中某个 job 因
  # Maven Central 403 / runner 网络抖动等间歇性原因失败时，精准补跑，
  # 避免全 matrix 重跑造成的资产冲突与时间浪费）。
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: false
        type: string
      build-args:
        required: false
        type: string
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
      asset-name-pattern:
        required: false
        type: string
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      mobile:
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.mobile == '' && inputs.platform || format('{0}-{1}', inputs.platform, inputs.mobile) }}-${{ contains(inputs.build-args, 'tethering') && 'tethering' || 'standard' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install additional system dependencies (Linux)
        if: runner.os == 'Linux' && inputs.mobile == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install libgphoto2 for Tethering (Linux)
        if: runner.os == 'Linux' && contains(inputs.build-args, 'tethering')
        run: |
          sudo apt-get install -y libgphoto2-dev

      - name: Install libgphoto2 for Tethering (macOS)
        if: runner.os == 'macOS' && contains(inputs.build-args, 'tethering')
        run: |
          brew install libgphoto2 pkg-config

      # ------------- Android Setup -------------
      - name: Set up JDK
        if: inputs.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: inputs.mobile == 'android'
        uses: android-actions/setup-android@v3
        with:
          # 注意：action 默认安装的 `tools` 包已从 Android SDK 仓库彻底移除
          # （2024 年宣布弃用，2025 年起 sdkmanager 报
          # "Failed to find package 'tools'" 并使任务失败）。
          # 替代方案为 `cmdline-tools;latest`（sdkmanager 自身所在包）。
          packages: 'cmdline-tools;latest platform-tools'

      - name: Setup Android NDK
        if: inputs.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android signing
        if: inputs.mobile == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          if [[ -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" && -n "${ANDROID_KEY_BASE64}" ]]; then
            echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
            echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
            echo "${ANDROID_KEY_BASE64}" | base64 -d > $RUNNER_TEMP/keystore.jks
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "✅ Android release signing configured from secrets."
          else
            echo "⚠️ Android release signing secrets not configured. Generating a temporary debug keystore..."
            DEBUG_KS=$RUNNER_TEMP/debug.keystore
            keytool -genkeypair -v -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>&1
            echo "keyAlias=androiddebugkey" > keystore.properties
            echo "password=android" >> keystore.properties
            echo "storeFile=$DEBUG_KS" >> keystore.properties
            echo "storePassword=android" >> keystore.properties
            echo "✅ Debug keystore created at $DEBUG_KS"
          fi

      - name: rustup install target
        if: ${{ inputs.target != '' }}
        run: rustup target add ${{ inputs.target }}

      - id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' }}
        run: |
          platform="${{ inputs.platform }}"
          if [[ "${{ inputs.mobile }}" == "android" ]]; then
            replacement="android"
          else
            replacement="$(echo ${platform} | sed -E 's/-latest//')"
          fi
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - id: tauri-build
        name: Build with tauri-action
        if: ${{ inputs.mobile == '' }}
        # FIXME set this back to a release major version, ex. v0 . This is a commit from the `dev` branch which includes PR
        # https://github.com/tauri-apps/tauri-action/pull/1099 , adding the assetNamePattern feature.
        uses: tauri-apps/tauri-action@cf3eb9b18add8548a40584695215c80ab7274f31
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ startsWith(inputs.platform, 'ubuntu') }}
        with:
          args: --verbose ${{ inputs.build-args }} ${{ inputs.target != '' && '--target' || ''  }} ${{ inputs.target }}
          assetNamePattern: ${{ steps.patch-release-name.outputs.platform }}
          releaseId: ${{ inputs.release-id }}
          retryAttempts: 3

      - name: Build Android
        if: ${{ inputs.mobile == 'android' }}
        shell: bash
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # build.rs 会自动从 hf-mirror → HuggingFace 降级链下载 Android ORT 到 src-tauri/libs/arm64-v8a/
          ORT_LIB_LOCATION: ${{ format('{0}/src-tauri/libs/arm64-v8a', github.workspace) }}
          ORT_STRATEGY: manual
        run: |
          npx tauri android build --verbose ${{ inputs.build-args }}

      - name: Prepare Android Release Assets
        if: ${{ inputs.mobile == 'android' && inputs.release-id != '' }}
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="$RUNNER_TEMP/android-release-assets"
          mkdir -p "$stage_dir"

          app_name="anwuRAW"
          version="$(node -e "const fs=require('fs'); const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(conf.version || '')")"
          arch="${{ inputs.target }}"
          arch="${arch%%-*}"
          template='${{ steps.patch-release-name.outputs.platform }}'

          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | while read -r file; do
            # 不带点的扩展名：模板中占位符为 [ext]，点由模板的 ".[ext]" 提供，
            # 若此处再带点会拼出 "aarch64..apk" 双点文件名
            ext="${file##*.}"
            asset_name="${template//\[name\]/$app_name}"
            asset_name="${asset_name//\[version\]/$version}"
            asset_name="${asset_name//\[arch\]/$arch}"
            asset_name="${asset_name//\[ext\]/$ext}"
            cp "$file" "$stage_dir/$asset_name"
          done

      - name: Upload Android Release Assets
        if: ${{ inputs.mobile == 'android' && inputs.release-id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 按数字 release id 精确上传（ensure-release 透传），不再按 tag 名解析：
          # 当存在多个同 tag_name 的 release（如 tag 被强推重建后的旧草稿）时，
          # `gh release upload <tag>` 会命中错误对象导致资产落到错误 release。
          # 先删除同名旧资产再上传，等价于 --clobber 且保持可重跑幂等。
          release_id="${{ inputs.release-id }}"

          # 防御：stage 目录为空时 glob 走字面量，后续 POST 会以诡异方式失败，
          # 这里 fail-fast 给出可读错误（正常失败应在上游 Build/Prepare 步骤暴露）
          shopt -s nullglob
          files=("$RUNNER_TEMP"/android-release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Android assets staged in $RUNNER_TEMP/android-release-assets (Prepare step found no APK/AAB)"
            exit 1
          fi

          for f in "${files[@]}"; do
            name="$(basename "$f")"
            stale_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id" 2>/dev/null || true)"
            for eid in $stale_ids; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${eid}" 2>/dev/null || true
            done
            # 资产上传端点必须在 uploads.github.com 域名：GitHub REST 文档规定
            # "Upload a release asset" 走 uploads.github.com，POST 到 api.github.com
            # 的同名路径会返回 404（查询/删除等管理端点才在 api.github.com）。
            # 教训：v1.6.21 Android job 上传资产时全部 404 失败即因此。
            uploaded=0
            for attempt in 1 2 3; do
              if gh api --method POST \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                -H "Content-Type: application/octet-stream" \
                --input "$f" >/dev/null; then
                uploaded=1
                break
              fi
              echo "⚠️ upload attempt $attempt/3 failed for ${name}"
              sleep $((attempt * 5))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed to upload ${name} to release ${release_id} after 3 attempts"
              exit 1
            fi
            echo "uploaded: ${name}"
          done

      - name: Upload Android Artifacts
        if: ${{ inputs.mobile == 'android' && inputs.release-id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_android${{ inputs.target && format('_{0}', inputs.target) || '' }}_artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: Upload Windows Artifacts
        if: ${{ startsWith(inputs.platform, 'windows') && inputs.release-id == '' && inputs.mobile == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_${{ inputs.platform }}${{ inputs.target && format('_{0}', inputs.target) || '' }}_artifacts
          path: |
            src-tauri/target/${{ inputs.target || 'release' }}/bundle/**/*.exe
            src-tauri/target/${{ inputs.target || 'release' }}/release/bundle/**/*.exe
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: Upload Linux/macOS Artifacts
        if: ${{ !startsWith(inputs.platform, 'windows') && inputs.release-id == '' && inputs.mobile == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_${{ inputs.platform }}${{ inputs.target && format('_{0}', inputs.target) || '' }}${{ contains(inputs.build-args, 'tethering') && '_tethering' || '' }}_artifacts
          path: |
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.rpm
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.deb
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.AppImage
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.dmg
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.app.tar.gz
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
