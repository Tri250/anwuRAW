name: build

on:
  # Manual entry point for retrying a single platform (e.g. Android) without
  # rebuilding the whole release matrix.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Runner label (e.g. ubuntu-latest, windows-latest, macos-14)'
        required: true
        type: string
      target:
        description: 'Rust target triple, empty for the host default'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Extra `tauri build` arguments'
        required: false
        type: string
        default: ''
      mobile:
        description: 'Set to "android" to build the Android bundle'
        required: false
        type: string
        default: ''
      release-id:
        description: 'Release ID to upload the bundles to'
        required: false
        type: string
        default: ''
      tag-name:
        description: 'Tag used when uploading Android assets via gh'
        required: false
        type: string
        default: ''
      asset-prefix:
        description: 'Prefix for asset names (e.g. 04)'
        required: false
        type: string
        default: ''
      asset-name-pattern:
        description: 'Asset name pattern, e.g. [name]_v[version]_[platform]_[arch][ext]'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to build, empty uses the dispatched ref'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
      asset-name-pattern:
        required: false
        type: string
      upload-artifacts:
        required: false
        type: boolean
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      tag-name:
        required: false
        type: string
        default: ''
      mobile:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.mobile == '' && inputs.platform || format('{0}-{1}', inputs.platform, inputs.mobile) }}-${{ contains(inputs.build-args, 'tethering') && 'tethering' || 'standard' }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install additional system dependencies (Linux)
        if: runner.os == 'Linux' && inputs.mobile == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install libgphoto2 for Tethering (Linux)
        if: runner.os == 'Linux' && contains(inputs.build-args, 'tethering')
        run: |
          sudo apt-get install -y libgphoto2-dev

      - name: Install libgphoto2 for Tethering (macOS)
        if: runner.os == 'macOS' && contains(inputs.build-args, 'tethering')
        run: |
          brew install libgphoto2 pkg-config

      # ------------- Android Setup -------------
      - name: Set up JDK
        if: inputs.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        if: inputs.mobile == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      # The runner image already ships the Android SDK; re-downloading
      # cmdline-tools via android-actions/setup-android used to abort after ~7
      # minutes on hosted runners. Only make sure the required packages exist.
      - name: Verify Android SDK
        if: inputs.mobile == 'android'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT is not set on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$sdk_root/platforms" "$sdk_root/build-tools"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android signing
        if: inputs.mobile == 'android' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd src-tauri/gen/android
          if [[ -n "${ANDROID_KEY_BASE64:-}" ]]; then
            echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
            echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
            printf '%s' "${ANDROID_KEY_BASE64}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "Using the release keystore from repository secrets."
          elif [[ -f rapidraw-release.keystore ]]; then
            # The checked-in sideload keystore keeps the APK signature stable
            # across builds so users can upgrade without uninstalling.
            echo "keyAlias=rapidraw" > keystore.properties
            echo "password=rapidraw" >> keystore.properties
            echo "storeFile=$PWD/rapidraw-release.keystore" >> keystore.properties
            echo "Using the checked-in sideload keystore."
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            echo "keyAlias=androiddebugkey" > keystore.properties
            echo "password=android" >> keystore.properties
            echo "storeFile=$RUNNER_TEMP/debug.keystore" >> keystore.properties
            echo "::warning::No ANDROID_KEY_* secrets configured; the APK is signed with a generated debug keystore."
          fi

      - name: rustup install target
        if: ${{ inputs.target != '' || inputs.mobile == 'android' }}
        shell: bash
        run: |
          if [[ "${{ inputs.mobile }}" == "android" ]]; then
            rustup target add aarch64-linux-android
          else
            rustup target add ${{ inputs.target }}
          fi

      - id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' }}
        run: |
          platform="${{ inputs.platform }}"
          if [[ "${{ inputs.mobile }}" == "android" ]]; then
            replacement="android"
          else
            replacement="$(echo ${platform} | sed -E 's/-latest//')"
          fi
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - id: tauri-build
        name: Build with tauri-action
        if: ${{ inputs.mobile == '' }}
        # FIXME set this back to a release major version, ex. v0 . This is a commit from the `dev` branch which includes PR
        # https://github.com/tauri-apps/tauri-action/pull/1099 , adding the assetNamePattern feature.
        uses: tauri-apps/tauri-action@cf3eb9b18add8548a40584695215c80ab7274f31
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ startsWith(inputs.platform, 'ubuntu') }}
        with:
          args: --verbose ${{ inputs.build-args }} ${{ inputs.target != '' && '--target' || ''  }} ${{ inputs.target }}
          assetNamePattern: ${{ steps.patch-release-name.outputs.platform }}
          releaseId: ${{ inputs.release-id }}
          retryAttempts: 3

      # ort-sys has no prebuilt ONNX Runtime for Android and panics while trying
      # to download one, so the library is fetched here and pointed at with
      # ORT_LIB_LOCATION. build.rs reuses the same file for jniLibs.
      - name: Fetch ONNX Runtime for Android
        if: ${{ inputs.mobile == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          dest="src-tauri/libs/arm64-v8a"
          mkdir -p "$dest"
          curl -fL --retry 3 --retry-delay 5 -o "$dest/libonnxruntime.so" \
            "https://huggingface.co/CyberTimon/RapidRAW-Models/resolve/main/onnxruntimes-v1.22.0/libonnxruntime-android-arm64-v8a.so?download=true"
          echo "999ecfdb5b5a13e4097487773b6d71ce8a075408a237daab072e8f5e817bd78e  $dest/libonnxruntime.so" | sha256sum -c -
          ls -la "$dest"

      # --target aarch64 keeps both cargo and gradle on the single ABI that
      # build.rs provides; the ORT_* vars come from the fetch step above.
      - name: Build Android
        if: ${{ inputs.mobile == 'android' }}
        shell: bash
        timeout-minutes: 120
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ORT_LIB_LOCATION: ${{ github.workspace }}/src-tauri/libs/arm64-v8a
          ORT_SKIP_DOWNLOAD: '1'
        run: |
          npx tauri android build --verbose --target aarch64 ${{ inputs.build-args }}

      # Fail the build when the APK is not correctly signed or aligned, so a
      # broken Android bundle never reaches the release page.
      - name: Verify Android bundle
        if: ${{ inputs.mobile == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*')
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          build_tools="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            "$build_tools/zipalign" -c -P 16 4 "$apk"
          done

      - name: Prepare Android Release Assets
        if: ${{ inputs.mobile == 'android' && inputs.release-id != '' }}
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="$RUNNER_TEMP/android-release-assets"
          mkdir -p "$stage_dir"

          app_name="RapidRAW"
          version="$(node -e "const fs=require('fs'); const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(conf.version || '')")"
          if [[ "${{ inputs.mobile }}" == "android" ]]; then
            arch="arm64-v8a"
          else
            arch="${{ inputs.target }}"
            arch="${arch%%-*}"
          fi
          template='${{ steps.patch-release-name.outputs.platform }}'

          find src-tauri/gen/android/app/build/outputs -type f \
            \( -name '*.apk' -o -name '*.aab' \) -path '*release*' | while read -r file; do
            ext=".${file##*.}"
            asset_name="${template//\[name\]/$app_name}"
            asset_name="${asset_name//\[version\]/$version}"
            asset_name="${asset_name//\[arch\]/$arch}"
            asset_name="${asset_name//\[ext\]/$ext}"
            cp "$file" "$stage_dir/$asset_name"
          done

      - name: Upload Android Release Assets
        if: ${{ inputs.mobile == 'android' && inputs.release-id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag_name="${{ inputs.tag-name }}"
          if [[ -z "$tag_name" ]]; then
            tag_name="${{ inputs.ref }}"
            tag_name="${tag_name#refs/tags/}"
          fi
          gh release upload "$tag_name" "$RUNNER_TEMP"/android-release-assets/* --clobber

      - name: Upload Android Artifacts
        if: ${{ inputs.mobile == 'android' && inputs.release-id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_android${{ inputs.target && format('_{0}', inputs.target) || '' }}_artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: Upload Windows Artifacts
        if: ${{ startsWith(inputs.platform, 'windows') && inputs.release-id == '' && inputs.mobile == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_${{ inputs.platform }}${{ inputs.target && format('_{0}', inputs.target) || '' }}_artifacts
          path: |
            src-tauri/target/${{ inputs.target || 'release' }}/bundle/**/*.exe
            src-tauri/target/${{ inputs.target || 'release' }}/release/bundle/**/*.exe
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: Upload Linux/macOS Artifacts
        if: ${{ !startsWith(inputs.platform, 'windows') && inputs.release-id == '' && inputs.mobile == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}_${{ inputs.platform }}${{ inputs.target && format('_{0}', inputs.target) || '' }}${{ contains(inputs.build-args, 'tethering') && '_tethering' || '' }}_artifacts
          path: |
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.rpm
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.deb
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.AppImage
            src-tauri/target/${{ inputs.target || 'release' }}/**/*.dmg
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
