name: CI Build

on:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Representative targets only: the full desktop/ARM matrix is built by
        # the release workflow. Keeping CI to three jobs maintains cross-platform
        # compile coverage without bundling every installer on each push.
        include:
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            asset-prefix: '02'
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    # CI only compiles and uploads build artifacts; the release job grants the
    # write token needed to attach bundles to a release.
    permissions:
      contents: read
